# Revenant AWS Free Tier Configuration
# Use this for zero-cost restore validation (first 12 months)
#
# Cost: $0 for 12 months (AWS free tier)
# After 12 months: ~$0.15-$0.50 per validation run
#
# Setup:
# 1. Sign up for AWS free tier account
# 2. Create RDS Postgres instance
# 3. Create at least 1 snapshot
# 4. Get your RDS instance ID from AWS Console
# 5. Replace "prod-database-instance" with your instance ID below
# 6. Set AWS credentials in GitHub Secrets or .env file
#
# SNAPSHOT + RESTORE FLOW:
#   snapshot — checks live DATABASE_URL, then creates RDS snapshot (see cmd/snapshot.go)
#   verify   — restores latest snapshot to sandbox, runs checks, destroys sandbox
#
# Local:
#   export DATABASE_URL="postgres://...@database-1.../postgres?sslmode=require"
#   export AWS_ACCESS_KEY_ID=... AWS_SECRET_ACCESS_KEY=... AWS_REGION=eu-west-2
#   revenant snapshot --config revenant-aws-freetier.yaml
#   revenant verify   --config revenant-aws-freetier.yaml
#
# GitHub Actions (no DATABASE_URL secret — built in workflow from RDS_HOST + SANDBOX_*):
#   .github/workflows/free-snapshot.yml
#   .github/workflows/free-restore-test.yml

plan: aws-free-tier-validation

database:
  engine: postgres
  # Sandbox connection string - these come from your AWS master user
  connection: postgres://${SANDBOX_USER}:${SANDBOX_PASSWORD}@${SANDBOX_ENDPOINT}:5432/${SANDBOX_DBNAME}?sslmode=require

recovery:
  engine: aws-rds

  # Replace with your RDS instance ID (find in AWS Console > RDS > Databases)
  source_identifier: database-1

  # AWS region where your RDS instance is (e.g., us-east-1, eu-west-1)
  region: eu-west-2

  # KEY: Use AWS free-tier compatible class (db.t3.micro supports encrypted snapshots)
  use_freetier: true

  # Safety: auto-delete sandboxes older than 2 hours
  max_sandbox_age: 2h

# Validation checks - customize based on your database schema
checks:
  # Verify schema wasn't corrupted
  - type: schema
    expect_tables:
      - customers
      - orders

  # Verify you have enough data
  - type: row_count
    table: customers
    min: 1

  - type: row_count
    table: orders
    min: 1

  # Verify foreign key relationships are intact
  - type: foreign_key
    table: orders
    references: customers

  # Check data freshness (RPO = Recovery Point Objective)
  # Make sure restored data is not older than 1 day
  - type: freshness
    table: orders
    column: created_at
    max_age: 24h

  # Custom business logic check
  - type: golden_query
    query: "SELECT COUNT(*) FROM orders WHERE created_at > NOW() - INTERVAL '7 days'"
    expect_min: 1
