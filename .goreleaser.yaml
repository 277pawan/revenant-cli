# GoReleaser builds cross-platform binaries and attaches them to a GitHub Release.
# Trigger: push a git tag like v0.1.0 (see .github/workflows/release.yml).
#
# Docs: https://goreleaser.com

version: 2

project_name: revenant

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: revenant
    main: .
    binary: revenant
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "revenant_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CONFIG.md
      - examples/revenant.yaml
      - examples/workflows/*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^chore:'

release:
  github:
    owner: 277pawan
    name: revenant-cli
  draft: false
  prerelease: auto
