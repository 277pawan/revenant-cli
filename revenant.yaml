# Generated by: revenant init
# Review this file, then run: revenant verify
#
# Revenant does not read your app source. These checks talk to a live database.
# Add your own golden_query checks for business rules we cannot guess.

plan: local-database-validation

database:
  engine: postgres
  connection: ${DATABASE_URL}

checks:
  - type: connect

  - type: schema
    expect_tables:
      - customers
      - orders

  - type: row_count
    table: customers
    min: 1

  - type: row_count
    table: orders
    min: 1

  - type: foreign_key
    table: orders
    references: customers

  - type: golden_query
    query: "SELECT count(*) FROM customers"
    expect_min: 1

  - type: freshness
    table: customers
    column: created_at
    max_age: 24h
