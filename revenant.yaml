# Generated by: revenant init
# Review this file, then run: revenant verify
#
# Revenant does not read your app source. These checks talk to a live database.
# Add your own golden_query checks for business rules we cannot guess.

plan: local-pawan

database:
  engine: postgres
  connection: ${DATABASE_URL}

# OPTIONAL: Restore from AWS RDS snapshot (AWS free tier = $0 for 12 months)
# Uncomment below to enable AWS restoration:
# recovery:
#   engine: aws-rds
#   source_identifier: your-rds-instance-id
#   region: us-east-1
#   use_freetier: true                    # Uses db.t3.micro (encrypted-snapshot compatible)
#   max_sandbox_age: 2h

checks:
  - type: schema
    expect_tables:
      - customers
      - orders

  - type: row_count
    table: customers
    min: 1

  - type: row_count
    table: orders
    min: 1

  - type: foreign_key
    table: orders
    references: customers

  - type: golden_query
    query: "SELECT count(*) FROM customers"
    expect_min: 1

  - type: freshness
    table: customers
    column: created_at
    max_age: 24h
