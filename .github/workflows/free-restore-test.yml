name: Free Restore Validation (AWS Free Tier)

# Dogfood workflow for this repo's AWS restore path.
# Uses the same published binary + action that external users get (not go build).
# Requires GitHub Secrets: AWS_*, SANDBOX_* (see AWS_FREETIER_SETUP.md).

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: 277pawan/revenant-action@v1.0.1
        with:
          version: v0.1.0
          config: revenant-aws-freetier.yaml
          command: verify
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          SANDBOX_USER: ${{ secrets.SANDBOX_USER }}
          SANDBOX_PASSWORD: ${{ secrets.SANDBOX_PASSWORD }}
          SANDBOX_DBNAME: postgres

      - uses: 277pawan/revenant-action@v1.0.1
        if: always()
        with:
          version: v0.1.0
          command: reap
          args: --max-age 4h --region us-east-1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1

      - name: Upload Validation Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-report
          path: |
            report.json
            report.md
          retention-days: 90
          if-no-files-found: ignore

      - name: Failure summary
        if: failure()
        run: |
          {
            echo "## Revenant restore validation failed"
            echo ""
            echo "Download the **restore-report** artifact for report.json / report.md."
            echo ""
            echo "Common causes: missing AWS secrets, no RDS snapshot, sandbox credentials wrong."
          } >> "$GITHUB_STEP_SUMMARY"
