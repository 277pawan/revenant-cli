name: Free Restore Validation (AWS Free Tier)

# Dogfood workflow for this repo's AWS restore path.
# Runs on a schedule and on manual trigger (workflow_dispatch).
# Requires GitHub Secrets: AWS_*, SANDBOX_* (see AWS_FREETIER_SETUP.md).

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # Until v0.1.0 is tagged, build from source. After the first GitHub
      # Release exists, switch this step to install-revenant.sh (see action repo).
      - name: Build Revenant
        run: go build -o revenant .

      - name: Run Restore Validation (AWS Free Tier)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          SANDBOX_USER: ${{ secrets.SANDBOX_USER }}
          SANDBOX_PASSWORD: ${{ secrets.SANDBOX_PASSWORD }}
          SANDBOX_DBNAME: postgres
        run: |
          # use_freetier: true in yaml → db.t3.micro (encrypted-snapshot compatible)
          ./revenant verify --config revenant-aws-freetier.yaml

      - name: Cleanup Orphaned Sandboxes
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
        run: ./revenant reap --max-age 4h --region us-east-1

      - name: Upload Validation Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-report
          path: |
            report.json
            report.md
          retention-days: 90
          if-no-files-found: ignore

      # Scheduled runs have no PR/issue context — write to the job summary instead.
      - name: Failure summary
        if: failure()
        run: |
          {
            echo "## Revenant restore validation failed"
            echo ""
            echo "Download the **restore-report** artifact for report.json / report.md."
            echo ""
            echo "Common causes: missing AWS secrets, no RDS snapshot, sandbox credentials wrong."
          } >> "$GITHUB_STEP_SUMMARY"
